name: Good Bila · Android prototype

on:
  push:
    branches: [main]
    paths:
      - 'projetos/bila-mobile/**'
      - '.github/workflows/good-bila-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: good-bila-android
  cancel-in-progress: false

jobs:
  android-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare local Android tools
        run: python3 projetos/bila-mobile/tools/setup_android.py
      - name: Run Good Bila tests
        run: bash projetos/bila-mobile/tools/testar.sh
      - name: Export and verify test APK
        run: bash projetos/bila-mobile/tools/export_apk.sh
      - name: Publish pilot release
        shell: bash
        run: |
          version="$(python3 -c 'import re,pathlib; print(re.search(r"config/version=\"([^\"]+)\"", pathlib.Path("projetos/bila-mobile/project.godot").read_text()).group(1))')"
          tag="good-bila-v${version}"
          apk="projetos/bila-mobile/build/good-bila-${version}.apk"
          checksum="projetos/bila-mobile/build/SHA256SUMS.txt"
          cp projetos/bila-mobile/build/bila-piloto.apk "$apk"
          sha256sum "$apk" > "$checksum"
          notes="projetos/bila-mobile/build/release-notes.md"
          cat > "$notes" <<NOTES
          Good Bila ${version} — playable Android ARM32/ARM64 prototype.

          [Presentation, screenshots, and how to play](https://github.com/${GH_REPO}/blob/main/docs/good-bila/README.md)
          [Support / discuss a partnership](https://github.com/${GH_REPO}/blob/main/docs/good-bila/SUPPORT.md)

          Development APK, outside Google Play. If an earlier prototype uses a different signature, uninstall it before installing this build. Profiles and best scores are stored locally.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Version $tag is already published; the existing APK will be preserved."
          else
            gh release create "$tag" "$apk" "$checksum" --target "$GITHUB_SHA" --title "Good Bila ${version} · Android prototype" --prerelease --notes-file "$notes"
          fi
      - name: Update legacy release language
        shell: bash
        run: |
          if gh release view good-bila-v0.21.0 >/dev/null 2>&1; then
            cat > /tmp/good-bila-legacy-notes.md <<'NOTES'
          Good Bila 0.21.0 — original playable prototype for Android ARM32/ARM64.

          This historical build has the original Portuguese interface. For the English game, download version 0.22.0 or later.

          [Presentation and how to play](https://github.com/levymtmr/Sygil-Tech/blob/main/docs/good-bila/README.md)
          [Support and partnerships](https://github.com/levymtmr/Sygil-Tech/blob/main/docs/good-bila/SUPPORT.md)

          Test APK, outside Google Play. Builds with different development signatures may require uninstalling an earlier version first. Profiles and best scores are local.
          NOTES
            gh release edit good-bila-v0.21.0 --title "Good Bila 0.21.0 · original Android prototype" --notes-file /tmp/good-bila-legacy-notes.md
          fi
