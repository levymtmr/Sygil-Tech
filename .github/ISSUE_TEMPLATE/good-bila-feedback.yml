name: "Good Bila · prototype feedback"
description: "Report an issue or share your experience playing."
title: "[Good Bila / feedback] "
body:
  - type: input
    id: version
    attributes:
      label: Game version
      placeholder: "For example, 0.22.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and operating system
      placeholder: "Phone model and Android version, or Godot on desktop"
  - type: textarea
    id: feedback
    attributes:
      label: What happened, or what did you think?
      description: "Describe what you expected, what happened, and how to reproduce an issue. Screenshots and videos help."
    validations:
      required: true
